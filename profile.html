<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJAS – Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="auth-guard.js"></script>
  <script src="api.js"></script>
  <script src="ble-adapter.js"></script>
  <script src="band.js"></script>
</head>
<body>
  <main class="phone">
    <!-- Page header -->
    <header class="page-header">
      <a href="home.html" class="icon-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      </a>
      <h1>Profile</h1>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <!-- Add info + photo -->
    <section class="card info-card" id="info-card">
      <div class="info-head">
        <div class="profile-name-row">
          <h3 id="profile-name">Neha</h3>
          <button class="icon-btn edit-profile-btn" id="edit-info" type="button" aria-label="Edit profile">
            <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>
          </button>
          <div class="profile-form-actions" id="profile-form-actions" hidden>
            <button type="button" class="btn-ghost" id="cancel-info">Cancel</button>
            <button type="submit" class="btn-primary" form="info-form">Save</button>
          </div>
        </div>
      </div>

      <label class="photo-box" aria-label="Upload profile photo">
        <input type="file" accept="image/*" id="photo-input" hidden />
        <img id="photo-preview" alt="" hidden />
        <span class="photo-empty" id="photo-empty">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Add photo</span>
        </span>
      </label>

      <dl class="info-list" id="info-list"></dl>

      <form class="info-form" id="info-form" hidden>
        <label>Name <input name="name" type="text" autocomplete="name" /></label>
        <label>Date of birth <input name="dob" type="date" /></label>
        <label>Blood group
          <select name="blood">
            <option value="">Select</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </label>
        <label>Height (cm) <input name="height" type="number" min="0" inputmode="numeric" /></label>
        <label>Weight (kg) <input name="weight" type="number" min="0" inputmode="decimal" step="0.1" /></label>
        <label>Phone <input name="phone" type="tel" autocomplete="tel" /></label>
      </form>
    </section>

    <!-- Documents -->
    <section class="card docs-card">
      <div class="docs-toolbar">
        <label class="upload-btn" aria-label="Upload documents">
        <input type="file" id="doc-input" multiple accept=".pdf,image/*,.doc,.docx" hidden />
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg>
        </label>
        <button class="docs-view-btn" id="view-docs" type="button">
          <span>View all documents</span>
          <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>

      <ul class="doc-list" id="doc-list"></ul>
      <p class="doc-empty" id="doc-empty">No documents yet. Add reports, prescriptions or ID.</p>
    </section>

    <div class="docs-modal" id="docs-modal" hidden>
      <button class="modal-backdrop" id="close-docs-backdrop" type="button" aria-label="Close documents"></button>
      <section class="docs-dialog" role="dialog" aria-modal="true" aria-labelledby="docs-title">
        <div class="docs-dialog-header">
          <h2 id="docs-title">Uploaded documents</h2>
          <button class="modal-close" id="close-docs" type="button" aria-label="Close documents">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <ul class="doc-list modal-doc-list" id="all-doc-list"></ul>
        <p class="doc-empty" id="all-doc-empty">No documents uploaded yet.</p>
      </section>
    </div>

    <button type="button" class="sign-out-btn" data-sign-out>
      <svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
      <span>Sign out</span>
    </button>
  </main>

  <script src="profile.js"></script>
</body>
</html>
