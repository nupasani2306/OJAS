<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJAS – Emergency Contacts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone">
    <!-- Status bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4-4.1a5.7 5.7 0 0 1 8 0l1.4-1.4a7.7 7.7 0 0 0-10.8 0L4 7.4ZM1.2 4.6a9.6 9.6 0 0 1 13.6 0L16 3.4a11.3 11.3 0 0 0-16 0l1.2 1.2Z"/></svg>
        <span class="battery"><span></span></span>
      </span>
    </div>

    <!-- Page header -->
    <header class="page-header">
      <a href="home.html" class="icon-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      </a>
      <h1>Emergency Contacts</h1>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <!-- Name -->
    <section class="card name-card">
      <div>
        <p class="label">Name</p>
        <h2 id="user-name">Neha</h2>
      </div>
      <p class="connected"><span class="dot"></span>OJAS Band connected</p>
    </section>

    <!-- Emergency message (editable) -->
    <section class="message-card">
      <div class="message-head">
        <span class="message-icon">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4Z"/><path d="M12 8v3M12 13.5h.01"/></svg>
        </span>
        <h3>Emergency message</h3>
        <button class="message-edit" id="edit-message" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>
          <span>Edit</span>
        </button>
      </div>

      <p class="message-text" id="message-text"></p>

      <form class="message-form" id="message-form" hidden>
        <label for="message-input" class="sr-only">Emergency message</label>
        <textarea id="message-input" name="message" rows="5" maxlength="300"></textarea>
        <div class="message-actions">
          <small id="message-count">0/300</small>
          <button type="button" class="btn-light" id="reset-message">Reset</button>
          <button type="button" class="btn-light" id="cancel-message">Cancel</button>
          <button type="submit" class="btn-white">Save</button>
        </div>
      </form>
    </section>

    <!-- Add contact -->
    <section class="card add-contact-card">
      <div class="section-title">
        <h3>Add a contact</h3>
        <p class="label">People to reach in an emergency</p>
      </div>
      <form class="contact-form" id="contact-form">
        <label>Name <input name="name" type="text" autocomplete="off" required /></label>
        <label>Relation
          <select name="relation">
            <option>Family</option><option>Parent</option><option>Spouse</option>
            <option>Sibling</option><option>Friend</option><option>Doctor</option><option>Other</option>
          </select>
        </label>
        <label class="wide">Phone <input name="phone" type="tel" autocomplete="off" inputmode="tel" required /></label>
        <button type="submit" class="btn-primary wide">
          <span>Add contact</span>
        </button>
      </form>
    </section>

    <!-- Contact list -->
    <section class="card contacts-card">
      <div class="contacts-pill">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 8.5a3 3 0 0 1 0 6M18.5 20a6 6 0 0 0-2.5-4.8"/></svg>
        <span>Emergency Contact List</span>
        <strong id="contact-count">0</strong>
      </div>

      <ul class="contact-list" id="contact-list"></ul>
      <p class="doc-empty" id="contact-empty">No contacts yet. Add someone above.</p>
    </section>
  </main>

  <script src="emergency.js"></script>
</body>
</html>
