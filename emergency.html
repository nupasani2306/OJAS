<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJAS – Emergency Contacts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="auth-guard.js"></script>
  <script src="api.js"></script>
  <script src="ble-adapter.js"></script>
  <script src="band.js"></script>
</head>
<body>
  <main class="phone">
    <!-- Page header -->
    <header class="page-header">
      <a href="home.html" class="icon-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      </a>
      <h1>Emergency Contacts</h1>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <!-- Emergency message (editable) -->
    <section class="message-card">
      <div class="message-head">
        <span class="message-icon">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4Z"/><path d="M12 8v3M12 13.5h.01"/></svg>
        </span>
        <h3>Emergency message</h3>
        <button class="message-edit" id="edit-message" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>
          <span>Edit</span>
        </button>
      </div>

      <p class="message-text" id="message-text"></p>

      <form class="message-form" id="message-form" hidden>
        <label for="message-input" class="sr-only">Emergency message</label>
        <textarea id="message-input" name="message" rows="5" maxlength="300"></textarea>
        <div class="message-actions">
          <small id="message-count">0/300</small>
          <button type="button" class="btn-light" id="reset-message">Reset</button>
          <button type="button" class="btn-light" id="cancel-message">Cancel</button>
          <button type="submit" class="btn-white">Save</button>
        </div>
      </form>
    </section>

    <!-- SOS message (editable) -->
    <section class="message-card sos-message-card">
      <div class="message-head">
        <span class="message-icon">
          <svg viewBox="0 0 24 24"><path d="M4 17h16M6 17V9l6-4 6 4v8M9 17v3h6v-3M12 8v4M12 14h.01"/></svg>
        </span>
        <h3>SOS message</h3>
        <button class="message-edit" id="edit-sos-message" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>
          <span>Edit</span>
        </button>
      </div>

      <p class="message-text" id="sos-message-text"></p>

      <form class="message-form" id="sos-message-form" hidden>
        <label for="sos-message-input" class="sr-only">SOS message</label>
        <textarea id="sos-message-input" name="message" rows="5" maxlength="300"></textarea>
        <div class="message-actions">
          <small id="sos-message-count">0/300</small>
          <button type="button" class="btn-light" id="reset-sos-message">Reset</button>
          <button type="button" class="btn-light" id="cancel-sos-message">Cancel</button>
          <button type="submit" class="btn-white">Save</button>
        </div>
      </form>
    </section>

    <!-- Add contact -->
    <section class="card add-contact-card">
      <div class="add-contact-toolbar">
        <div class="section-title">
          <h3>Add a contact</h3>
          <p class="label">People to reach in an emergency</p>
        </div>
        <button class="upload-btn add-contact-btn" id="add-contact-toggle" type="button" aria-label="Add contact">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M17 8v6M14 11h6"/></svg>
        </button>
      </div>
      <form class="contact-form" id="contact-form" hidden>
        <label class="wide">Use for
          <select name="messageType">
            <option value="emergency">Emergency message</option>
            <option value="sos">SOS message</option>
          </select>
        </label>
        <label>Name <input name="name" type="text" autocomplete="off" required /></label>
        <label>Relation
          <select name="relation">
            <option>Family</option><option>Parent</option><option>Spouse</option>
            <option>Sibling</option><option>Friend</option><option>Doctor</option><option>Other</option>
          </select>
        </label>
        <label class="wide">Phone <input name="phone" type="tel" autocomplete="off" inputmode="tel" required /></label>
        <button type="submit" class="btn-primary wide">
          <span>Add contact</span>
        </button>
      </form>
      <div class="contact-groups">
        <div class="contact-group">
          <h4>Emergency message contacts</h4>
          <ul class="contact-list" id="emergency-contact-list"></ul>
          <p class="doc-empty" id="emergency-contact-empty">No contacts yet.</p>
        </div>
        <div class="contact-group">
          <h4>SOS message contacts</h4>
          <ul class="contact-list" id="sos-contact-list"></ul>
          <p class="doc-empty" id="sos-contact-empty">No contacts yet.</p>
        </div>
      </div>
    </section>

  </main>

  <script src="emergency.js"></script>
</body>
</html>
