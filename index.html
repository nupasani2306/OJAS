<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJAS – Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone auth-page">
    <!-- Status bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4-4.1a5.7 5.7 0 0 1 8 0l1.4-1.4a7.7 7.7 0 0 0-10.8 0L4 7.4ZM1.2 4.6a9.6 9.6 0 0 1 13.6 0L16 3.4a11.3 11.3 0 0 0-16 0l1.2 1.2Z"/></svg>
        <span class="battery"><span></span></span>
      </span>
    </div>

    <!-- Brand -->
    <header class="auth-brand">
      <span class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21Z"/><path d="M5 12h3l1.5-3 3 6 1.5-3H19"/></svg>
      </span>
      <h1>OJAS</h1>
      <p id="auth-tagline">Your health, connected.</p>
    </header>

    <!-- Sign in / Sign up switch -->
    <div class="auth-tabs" role="tablist" aria-label="Account" id="auth-tabs">
      <button type="button" role="tab" id="tab-signin" aria-controls="signin-form" aria-selected="true" class="is-active">Sign in</button>
      <button type="button" role="tab" id="tab-signup" aria-controls="signup-form" aria-selected="false">Sign up</button>
    </div>

    <!-- Sign in -->
    <form class="card auth-form" id="signin-form" role="tabpanel" aria-labelledby="tab-signin" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input name="contact" type="email" autocomplete="username" required />
      </label>
      <label class="auth-field">
        <span>Password</span>
        <span class="auth-password">
          <input name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="auth-show" aria-label="Show password">Show</button>
        </span>
      </label>
      <button type="button" class="auth-link" id="forgot-btn">Forgot password?</button>

      <label class="auth-check">
        <input type="checkbox" name="addDevice" data-reveals="signin-device" />
        <span>Connect a new OJAS Band</span>
      </label>
      <div class="auth-device" id="signin-device" hidden></div>

      <p class="auth-error" role="alert" hidden></p>
      <button type="submit" class="auth-submit">Sign in</button>
    </form>

    <!-- Sign up -->
    <form class="card auth-form" id="signup-form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
      <label class="auth-field">
        <span>Full name</span>
        <input name="name" type="text" autocomplete="name" maxlength="60" required />
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input name="contact" type="email" autocomplete="username" required />
      </label>
      <label class="auth-field">
        <span>Password <small>(at least 8 characters)</small></span>
        <span class="auth-password">
          <input name="password" type="password" autocomplete="new-password" minlength="8" required />
          <button type="button" class="auth-show" aria-label="Show password">Show</button>
        </span>
      </label>
      <label class="auth-field">
        <span>Confirm password</span>
        <input name="confirm" type="password" autocomplete="new-password" required />
      </label>

      <div class="auth-device" id="signup-device"></div>
      <label class="auth-check">
        <input type="checkbox" name="later" />
        <span>I'll connect my band later</span>
      </label>

      <p class="auth-error" role="alert" hidden></p>
      <button type="submit" class="auth-submit">Create account</button>
    </form>

    <!-- Connect a band (signed in, no band yet) -->
    <form class="card auth-form" id="connect-form" novalidate hidden>
      <h2 class="auth-connect-title">Connect your OJAS Band</h2>
      <div class="auth-device" id="connect-device"></div>
      <p class="auth-error" role="alert" hidden></p>
      <button type="submit" class="auth-submit">Connect band</button>
      <a class="auth-link auth-skip" href="home.html">Skip for now</a>
    </form>

    
    <!-- Pairing progress -->
    <div class="auth-pairing" id="pairing" hidden>
      <div class="auth-pairing-card" role="status" aria-live="polite">
        <span class="auth-spinner" id="pair-spinner" aria-hidden="true"></span>
        <span class="auth-tick" id="pair-tick" aria-hidden="true" hidden>
          <svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>
        </span>
        <strong id="pair-title">Connecting to your OJAS Band…</strong>
        <small id="pair-detail">Keep the band close to your phone.</small>
        <button type="button" class="auth-submit" id="pair-done" hidden>Continue</button>
      </div>
    </div>

    <!-- Device code field (copied into each form) -->
    <template id="device-field">
      <label class="auth-field">
        <span>Device code</span>
        <span class="auth-code">
          <span class="auth-code-prefix" aria-hidden="true">OJAS-</span>
          <input name="deviceCode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" />
        </span>
        <small class="auth-hint">The 8-character code on the back of your band or on its box.</small>
      </label>
    </template>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
