<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJAS – Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone auth-page">
    <!-- Status bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4-4.1a5.7 5.7 0 0 1 8 0l1.4-1.4a7.7 7.7 0 0 0-10.8 0L4 7.4ZM1.2 4.6a9.6 9.6 0 0 1 13.6 0L16 3.4a11.3 11.3 0 0 0-16 0l1.2 1.2Z"/></svg>
        <span class="battery"><span></span></span>
      </span>
    </div>

    <!-- Brand -->
    <header class="auth-brand">
      <span class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21Z"/><path d="M5 12h3l1.5-3 3 6 1.5-3H19"/></svg>
      </span>
      <h1>OJAS</h1>
      <p id="auth-tagline">Set a new password</p>
    </header>

    <!-- New password (opened from the reset email) -->
    <form class="card auth-form" id="reset-form" novalidate hidden>
      <h2 class="auth-form-title">Choose a new password</h2>
      <p class="auth-note">Use at least 8 characters. You'll sign in with it from now on.</p>
      <label class="auth-field">
        <span>New password</span>
        <span class="auth-password">
          <input name="password" type="password" autocomplete="new-password" minlength="8" required />
          <button type="button" class="auth-show" aria-label="Show password">Show</button>
        </span>
      </label>
      <label class="auth-field">
        <span>Confirm new password</span>
        <input name="confirm" type="password" autocomplete="new-password" required />
      </label>
      <p class="auth-error" role="alert" hidden></p>
      <button type="submit" class="auth-submit">Save new password</button>
    </form>

    <!-- Link missing / expired, or password saved -->
    <section class="card auth-form" id="reset-message" hidden>
      <h2 class="auth-form-title" id="reset-message-title"></h2>
      <p class="auth-note" id="reset-message-text"></p>
      <a class="auth-submit" href="index.html" id="reset-message-link">Back to sign in</a>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
