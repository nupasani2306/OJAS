<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJAS – Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="auth-guard.js"></script>
</head>
<body>
  <main class="phone chat-phone">
    <!-- Status bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4-4.1a5.7 5.7 0 0 1 8 0l1.4-1.4a7.7 7.7 0 0 0-10.8 0L4 7.4ZM1.2 4.6a9.6 9.6 0 0 1 13.6 0L16 3.4a11.3 11.3 0 0 0-16 0l1.2 1.2Z"/></svg>
        <span class="battery"><span></span></span>
      </span>
    </div>

    <!-- Page header -->
    <header class="page-header">
      <a href="home.html" class="icon-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
      </a>
      <h1>OJAS Assistant</h1>
      <button class="icon-btn chat-clear" id="clear-chat" type="button" aria-label="Clear chat">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
      </button>
    </header>

    <!-- Conversation -->
    <section class="chat-log" id="chat-log" aria-live="polite" aria-label="Conversation"></section>

    <!-- Suggestions -->
    <div class="chat-suggestions" id="chat-suggestions">
      <button type="button">How is my heart rate?</button>
      <button type="button">Tips for better sleep</button>
      <button type="button">How much water should I drink?</button>
      <button type="button">What does SpO₂ mean?</button>
    </div>

    <!-- Composer -->
    <form class="chat-composer" id="chat-form">
      <label for="chat-input" class="sr-only">Message</label>
      <textarea id="chat-input" rows="1" maxlength="1000" placeholder="Ask about your health…"></textarea>
      <button class="chat-send" type="submit" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7Z"/></svg>
      </button>
    </form>
    <p class="chat-note">Not medical advice. In an emergency, use SOS.</p>
  </main>

  <script src="chat.js"></script>
</body>
</html>
